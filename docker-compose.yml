version: '3.8'

services:
  ai-service:
    build:
      context: ./ai-verification
      dockerfile: Dockerfile
    environment:
      - AI_ENABLE_DOCS=${AI_ENABLE_DOCS:-false}
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
    networks:
      - voting-network

  core-gateway:
    build:
      context: ./Core Gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/voting_db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:?Set POSTGRES_USER in .env}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      - SPRING_JPA_SHOW_SQL=${SPRING_JPA_SHOW_SQL:-false}
      - SERVICES_PYTHON_AI_URL=http://ai-service:8000/verify-liveness
      - APP_CORS_ALLOWED_ORIGINS=${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      - APP_AUTH_SESSION_SECRET=${APP_AUTH_SESSION_SECRET:?Set APP_AUTH_SESSION_SECRET in .env}
      - APP_AUTH_PREAUTH_SECRET=${APP_AUTH_PREAUTH_SECRET:?Set APP_AUTH_PREAUTH_SECRET in .env}
      - APP_ADMIN_TOKEN_SECRET=${APP_ADMIN_TOKEN_SECRET:?Set APP_ADMIN_TOKEN_SECRET in .env}
      - APP_BIOMETRIC_ENCRYPTION_KEY=${APP_BIOMETRIC_ENCRYPTION_KEY:?Set APP_BIOMETRIC_ENCRYPTION_KEY in .env}
      - APP_AUTH_ALLOW_BOOTSTRAP_PASSWORD=${APP_AUTH_ALLOW_BOOTSTRAP_PASSWORD:-false}
      - APP_AUTH_BOOTSTRAP_PASSWORD=${APP_AUTH_BOOTSTRAP_PASSWORD:-}
      - APP_DEMO_SEED_VOTER=${APP_DEMO_SEED_VOTER:-true}
      - APP_DEMO_PASSWORD=${APP_DEMO_PASSWORD:-}
      - APP_CONFIG_VERSION=${APP_CONFIG_VERSION:-1.0.0}
    depends_on:
      ai-service:
        condition: service_healthy
      postgres-db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    networks:
      - voting-network
      - fabric_test

  postgres-db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=voting_db
      - POSTGRES_USER=${POSTGRES_USER:?Set POSTGRES_USER in .env}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
    networks:
      - voting-network

  frontend-ui:
    build:
      context: ./frontend ui
      dockerfile: Dockerfile
    environment:
      - NEXT_PUBLIC_CORE_GATEWAY_URL=${NEXT_PUBLIC_CORE_GATEWAY_URL:-http://localhost:8080}
    ports:
      - "3000:3000"
    depends_on:
      core-gateway:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    networks:
      - voting-network

networks:
  voting-network:
    driver: bridge
  fabric_test:
    external: true
    name: fabric_test

volumes:
  postgres_data:
    driver: local
